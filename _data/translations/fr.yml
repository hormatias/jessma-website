about:
  title: À propos
  image_alt: Jessica - Décoration d'événements
  paragraphs:
    - Bonjour ! Je suis Jessica. J'adore faire vivre des émotions grâce à mes décorations. Formée en relations publiques, organisation d'événements et décoration de vitrines, j'allie créativité et technique pour donner vie à vos idées.
    - J'aime chaque projet et prends soin de chaque détail pour transformer une idée en décoration inoubliable. Mon objectif est de faire de votre événement un moment magique et spécial.
